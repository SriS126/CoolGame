<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrepreneur Quest Game</title>
<style>
body {
margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    display: flex;
  justify-content: center;
    align-items: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
}
    
#game-container {
  border: 4px solid #00ffff;
    border-radius: 12px;
  box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), 
              0 0 60px rgba(118, 75, 162, 0.3);
    background: #1a0033;
  overflow: hidden;
  position: relative;
}
    
#game-container::before {
  content: '';
    position: absolute;
  top: -2px;
    left: -2px;
  right: -2px;
    bottom: -2px;
  background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff);
    border-radius: 12px;
  z-index: -1;
  animation: borderGlow 3s linear infinite;
}
    
@keyframes borderGlow {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}
    
/* title thingy */
h1 {
  text-align: center;
    color: #00ffff;
  text-shadow: 0 0 10px #00ffff;
    margin-top: 20px;
}

/* lil xp bar thing */
.xp-bar {
  position: absolute;
  bottom: -30px;
  left: 0;
  right: 0;
  height: 22px;
  background: rgba(0,0,0,0.4);
  color: #0ff;
  font-size: 11px;
  display: flex;
  align-items: center;
  padding-left: 10px;
}

.xp-fill {
  height: 6px;
  width: 40%;
  background: linear-gradient(90deg,#00ffcc,#00ffff,#ffff00);
  box-shadow: 0 0 8px #00ffff;
  border-radius: 999px;
  margin-left: 8px;
}

/* quick popup thing */
.start-popup{
position: fixed;
 inset:0;
 background: rgba(0,0,0,0.7);
 display:flex;
 align-items:center;
 justify-content:center;
 z-index: 999;
}
.start-box{
background:#120022;
border:2px solid #0ff;
box-shadow:0 0 20px #0ff;
padding:18px 22px;
border-radius:10px;
color:#fff;
max-width:320px;
text-align:center;
font-size:14px;
}
.start-box button{
margin-top:12px;
padding:6px 16px;
border:none;
border-radius:20px;
background:#00ffff;
color:#120022;
cursor:pointer;
font-weight:bold;
}
.start-box button:hover{background:#fff;}
</style>
</head>
<body>
<div id="game-container">
  <div class="xp-bar">
    lvl 1 entrepreneur
    <div class="xp-fill"></div>
  </div>
</div>

<!-- lil start popup -->
<div class="start-popup" id="startPopup">
  <div class="start-box">
    <div style="font-weight:bold;margin-bottom:6px;">entrepreneur quest</div>
    <div style="margin-bottom:8px;">move around & talk to Stock to get biz questions 👀</div>
    <button id="startBtn">ok got it</button>
  </div>
</div>

<!-- phaser cdn -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  
<!-- main game script -->
<script src="gamescript.js"></script>
<script>
// tiny js just for popup
const btn = document.getElementById('startBtn')
const pop = document.getElementById('startPopup')
if(btn && pop){
  btn.addEventListener('click',()=>{
    pop.style.display='none'
  })
}
</script>
<script>
;(()=>{

  let on = false
  let tipz = ["charge what ur worth","talk to users fr","profit > vibes (sometimes)","ship it messy then fix it","dont buy 7 logos day 1 lol"]
  let box = document.createElement("div")
    box.style.position="fixed"
  box.style.left="50%"
    box.style.top="18px"
  box.style.transform="translateX(-50%)"
    box.style.padding="8px 12px"
  box.style.border="2px solid #0ff"
    box.style.borderRadius="999px"
  box.style.background="rgba(0,0,0,.55)"
    box.style.color="#0ff"
  box.style.fontFamily="Courier New, monospace"
    box.style.fontSize="12px"
  box.style.opacity="0"
    box.style.pointerEvents="none"
  box.style.transition="opacity .2s, transform .2s"
    box.style.zIndex="9999"
  document.body.appendChild(box)

  function pop(txt){
     box.textContent = txt
   box.style.opacity = "1"
     box.style.transform="translateX(-50%) translateY(0px)"
    clearTimeout(pop._t)
   pop._t = setTimeout(()=>{
      box.style.opacity="0"
     box.style.transform="translateX(-50%) translateY(-6px)"
   }, 900)
  }

  window.addEventListener("keydown",(e)=>{
    if((e.key||"").toLowerCase()!=="m") return

      on = !on

    let c = document.getElementById("game-container")
      if(c){
        c.style.filter = on ? "hue-rotate(160deg) saturate(1.4) contrast(1.05)" : ""
        c.style.transform = on ? "rotate(.2deg)" : ""
      }

    document.body.style.background = on
      ? "linear-gradient(135deg,#0f2027 0%,#203a43 50%,#2c5364 100%)"
      : "linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%)"

    pop(on ? ("mood: ON  |  tip: " + tipz[(Math.random()*tipz.length)|0]) : "mood: OFF")
  })

})()
</script>
<script>
;(()=>{

 let ui=document.createElement("div")
ui.style.position="fixed"
   ui.style.right="14px"
 ui.style.bottom="14px"
ui.style.padding="8px 10px"
 ui.style.background="rgba(0,0,0,.55)"
   ui.style.border="2px solid #0ff"
ui.style.borderRadius="10px"
 ui.style.color="#0ff"
ui.style.fontFamily="Courier New, monospace"
   ui.style.fontSize="12px"
ui.style.zIndex="9999"
 ui.style.userSelect="none"
ui.innerHTML="P = pause<br>best: ?"
 document.body.appendChild(ui)

let best= +localStorage.getItem("bestScoreLOL") || 0
 ui.innerHTML="P = pause<br>best: "+best

function grabScoreMaybe(){
 try{
  if(!window.game) return null
 let sc = game.scene && game.scene.getScenes ? game.scene.getScenes(true) : []
   let s=sc && sc[0]
    if(!s) return null
   if(typeof s.score==="number") return s.score
 }catch(e){}
 return null
}

 let paused=false

window.addEventListener("keydown",(e)=>{
   if((e.key||"").toLowerCase()!=="p") return

 paused=!paused

 try{
   if(window.game && game.scene){
    let sc=game.scene.getScenes ? game.scene.getScenes(true):[]
     let s=sc && sc[0]
      if(s){
       if(paused) s.sceneaweaweng.pause()
        else s.scene.resume()
      }
   }
 }catch(err){}

 ui.style.opacity = paused ? "1" : ".85"
   ui.style.transform = paused ? "scale(1.04)" : "scale(1)"
 ui.style.boxShadow = paused ? "0 0 18px #0ff" : ""
})

setInterval(()=>{
 let now=grabScoreMaybe()
   if(now==null) return
 if(now>best){
   best=now
  localStorage.setItem("bestScoreLOL",best)
 }
 ui.innerHTML="P = pause<br>best: "+best+"<br>score: "+now
}, 700)

})()
</script>
</body>
</html>
